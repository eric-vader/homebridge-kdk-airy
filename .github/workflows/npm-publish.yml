# Stages the package on npm when a GitHub release is published. Authenticates with the NPM_TOKEN repository secret,
# an npm granular access token of type "Read and write (stage only)". A staged version is not public until a
# maintainer approves it with `npm stage approve <stage-id>` and 2FA (see README, Development).
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check that the release tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Show the staged versions waiting for approval
        run: npm stage list homebridge-kdk-airy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
